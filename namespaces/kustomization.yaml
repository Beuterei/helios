# prune: disabled, so a layer move cannot garbage-collect a namespace and everything in it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - priorityclass.yaml
  - kube-system.yaml
  - kube-public.yaml
  - kube-node-lease.yaml
  - default.yaml
  - cert-manager.yaml
  - network.yaml
  - velero.yaml
  - cnpg-system.yaml
  - ai.yaml
  - paperless.yaml
  - pocket-id.yaml
  - norish.yaml
  - isponsorblocktv.yaml
