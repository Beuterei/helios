# Blocky, Pocket ID, and cloudflared use this class.
# A pod that names it is rejected until this object exists, so those layers wait on namespaces.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: edge
value: 1000000
globalDefault: false
description: Stay scheduled when the node evicts BestEffort and Burstable pods.
preemptionPolicy: PreemptLowerPriority
