# Waits for the GPU, chart sources, namespaces, TLS, app secrets, and CloudNativePG.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
    - name: platform
    - name: certs
    - name: secrets
    - name: cloudnative-pg
  interval: 10m
  path: ./apps
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
