# Workload HelmReleases. Waits for GPU, chart sources, names, and TLS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
    - name: platform
    - name: certs
  interval: 10m
  path: ./apps
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
