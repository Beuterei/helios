# cert-manager HelmRelease. CRDs must be Ready before certs.
# Path is the release under platform/; namespace and OCI source are other layers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
  interval: 10m
  path: ./platform/cert-manager
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
