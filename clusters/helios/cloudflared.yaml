# Remotely managed cloudflared. The tunnel token must already be decrypted.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
    - name: secrets
  interval: 10m
  path: ./platform/cloudflared
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
