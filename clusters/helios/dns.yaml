# Applied before the CoreDNS override, which forwards to Blocky instead of the host resolver.
# cert-manager and source-controller need those names to resolve.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
  interval: 10m
  path: ./dns
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
