# CRDs and the plugin must be Ready before an app Cluster is applied.
# The path holds only the releases; the namespace and HelmRepository are other layers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
    - name: cert-manager
  interval: 10m
  path: ./platform/cloudnative-pg
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
