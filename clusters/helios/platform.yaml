# CDI plugin, CoreDNS override, and secret reflector. Reflector needs the
# emberstack HelmRepository, so this waits on sources.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  dependsOn:
    - name: sources
  interval: 10m
  path: ./platform
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
