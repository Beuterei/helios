# CDI plugin and CoreDNS override, both in kube-system. GPU workloads wait on this.
# force: take ownership of coredns-custom, which used to live in apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform
  prune: true
  wait: true
  timeout: 10m
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
