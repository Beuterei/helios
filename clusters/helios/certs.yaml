# Applied after the operator, the token, and the target namespace exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certs
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: cert-manager
    - name: secrets
  interval: 10m
  path: ./certs
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
