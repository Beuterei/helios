# A mounted claim is copied, except claims labeled skip.
# Postgres is left for CloudNativePG.
# The paperless broker, the norish cache, and Ollama models are rebuilt or pulled.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: velero
      version: 12.2.3
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  driftDetection:
    mode: enabled
    # Velero clears skipImmediately, so drift detection ignores that field.
    ignore:
      - paths:
          - /spec/skipImmediately
        target:
          group: velero.io
          kind: Schedule
          name: velero-monthly
          namespace: velero
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # The plugin release has to match the chart app version.
    initContainers:
      - name: velero-plugin-for-aws
        image: docker.io/velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: plugins
            mountPath: /target
    # Flux applies the chart CRDs.
    upgradeCRDs: false
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: backup-lb
          prefix: velero
          default: true
          accessMode: ReadWrite
          credential:
            name: velero-s3
            # The chart mounts this key as the credentials file.
            key: cloud
          config:
            # The endpoint ignores the region, and the signer still requires one.
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: https://nbg1.your-objectstorage.com
            # Hetzner Object Storage rejects the AWS SDK checksum trailers.
            checksumAlgorithm: ""
      uploaderType: kopia
      # A claim that holds large files can outlast the default.
      fsBackupTimeout: 8h
      defaultItemOperationTimeout: 8h
      # Schedules use the pod clock.
      extraEnvVars:
        - name: TZ
          value: Europe/Berlin
      defaultVolumesToFsBackup: true
    credentials:
      existingSecret: velero-s3
    # local-path has no snapshotter.
    snapshotsEnabled: false
    deployNodeAgent: true
    nodeAgent:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
      # The cache has to outlive the pod, or the next run reads every file again.
      useScratchEmptyDir: false
      extraVolumes:
        - name: scratch
          hostPath:
            path: /var/lib/velero
            type: DirectoryOrCreate
      extraVolumeMounts:
        - name: scratch
          mountPath: /scratch
      # Reads other pods' volume mounts on the node.
      containerSecurityContext:
        privileged: true
    schedules:
      daily:
        schedule: "0 5 * * *"
        template:
          ttl: 720h
          storageLocation: default
          # Every other namespace is included.
          excludedNamespaces:
            - kube-system
            - kube-public
            - kube-node-lease
            - default
            - flux-system
            - cert-manager
            - network
            - velero
            - cnpg-system
          # Secrets are in git. The bucket must not hold them.
          excludedNamespaceScopedResources:
            - secrets
          snapshotVolumes: false
          defaultVolumesToFsBackup: true
          itemOperationTimeout: 8h
          resourcePolicy:
            kind: ConfigMap
            name: velero-volume-policy
      monthly:
        # The daily schedule already takes the first backup.
        skipImmediately: true
        schedule: "0 5 1 * *"
        template:
          ttl: 8760h
          storageLocation: default
          # Every other namespace is included.
          excludedNamespaces:
            - kube-system
            - kube-public
            - kube-node-lease
            - default
            - flux-system
            - cert-manager
            - network
            - velero
            - cnpg-system
          excludedNamespaceScopedResources:
            - secrets
          snapshotVolumes: false
          defaultVolumesToFsBackup: true
          itemOperationTimeout: 8h
          resourcePolicy:
            kind: ConfigMap
            name: velero-volume-policy
    configMaps:
      volume-policy:
        data:
          policy: |
            version: v1
            volumePolicies:
              - conditions:
                  pvcLabels:
                    helios.luisbeu.de/backup: skip
                action:
                  type: skip
              - conditions:
                  volumeTypes:
                    - emptyDir
                    - downwardAPI
                    - configmap
                action:
                  type: skip
