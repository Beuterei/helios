# Copies the wildcard TLS secret into namespaces that serve their own Ingress.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: 10.0.70
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
