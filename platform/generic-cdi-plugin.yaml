# NixOS writes the CDI spec on the host.
# Runs in kube-system because it is a kubelet device plugin, like the other node agents.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-cdi-plugin
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      # Path is relative to the GitRepository root.
      chart: ./charts/generic-cdi-plugin
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
