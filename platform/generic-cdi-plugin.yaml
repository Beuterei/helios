# Local chart, from this repo. NixOS already wrote the CDI spec on the host.
# kube-system: this is a kubelet device plugin, same as the other node agents.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-cdi-plugin
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      # Path is relative to the GitRepository root.
      chart: ./charts/generic-cdi-plugin
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
