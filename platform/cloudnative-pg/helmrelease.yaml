# The plugin certificates need cert-manager, and the app clusters wait for this release.
# TZ is the clock for ScheduledBackup. The cron has no timezone field.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      create: true
    monitoring:
      podMonitorEnabled: false
    additionalEnv:
      - name: TZ
        value: Europe/Berlin
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
