# A NixOS udev rule writes the ConBee CDI spec whenever the stick appears.
# One plugin reads one spec, so the stick has its own release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-cdi-plugin-zigbee
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/generic-cdi-plugin
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cdiSpec: /var/run/cdi/zigbee.json
