# Rolls a pod when a Secret it reads changes. ConfigMaps stay with Helm.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.19
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  values:
    reloader:
      autoReloadAll: true
      ignoreConfigMaps: true
      watchGlobally: true
