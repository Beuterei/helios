# One watcher for every namespace.
# A changed Secret restarts the pods that read it, so the process starts with the new values.
# ConfigMaps stay with Helm.
# The restart does not apply a database password, so run ALTER USER before changing the Secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.19
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      autoReloadAll: true
      ignoreConfigMaps: true
      watchGlobally: true
