# Issues certificates. The Cloudflare DNS-01 token is
# secrets/cloudflare-dns-01-token.enc.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  values:
    crds:
      enabled: true
      keep: true
