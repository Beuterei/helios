# Remotely managed Cloudflare Tunnel.
# https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/deployment-guides/kubernetes/
# The token comes from a Secret. Published hostnames are dashboard routes.
# Each Service must also be listed in the egress allowlist.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: network
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: cloudflare-tunnel-token
      valuesKey: token
      targetPath: cloudflare.tunnel_token
  values:
    replicaCount: 1
    image:
      repository: cloudflare/cloudflared
      tag: "2026.10.7"
