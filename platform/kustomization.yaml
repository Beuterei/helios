# Cluster operators and node plugins. Applied by the Flux Kustomization named "platform".
# cert-manager and cloudflared are sibling directories, each applied by its own
# Flux layer. cert-manager waits so CRDs are Ready before certs. cloudflared
# waits so the tunnel token exists before the connector starts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - generic-cdi-plugin.yaml
  - coredns-custom.yaml
