# Cluster operators and node plugins. Applied by the Flux Kustomization named "platform".
# cert-manager's HelmRelease is a sibling directory, applied by its own Flux layer
# so CRDs are Ready before certs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - generic-cdi-plugin.yaml
  - coredns-custom.yaml
