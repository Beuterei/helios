# Every bound claim not listed under exclude is copied.
# ollama holds models that can be pulled again.
# norish-valkey is a cache.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volume-backup
  namespace: backup
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: ./charts/volume-backup
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    exclude:
      - namespace: ai
        claim: ollama
      - namespace: norish
        claim: norish-valkey
