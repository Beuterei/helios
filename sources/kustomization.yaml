# Chart sources only. Applied by the Flux Kustomization named "sources".
# prune: disabled so a layer move does not delete the live chart repository.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - cert-manager.yaml
  - emberstack.yaml
  - cloudflare.yaml
  - johanneskastl.yaml
  - otwld.yaml
  - open-webui.yaml
  - stakater.yaml
