# Database password, master key, and Obscura token are secrets/norish.enc.yaml.
# Change them before the claims exist. The master key decrypts stored data.
secretName: norish

# Not a Norish setting. Node uses it for local time.
timeZone: Europe/Berlin
# Public URL. The Ingress is the oauth2-proxy release, not this chart.
publicURL: https://recipe.luisbeu.de

# Sign-in is Pocket ID. The client secret is secrets/norish-gate.enc.yaml.
# Norish sends PKCE. The admin group name is the value in the token.
oidc:
  name: Pocket ID
  issuer: https://auth.luisbeu.de
  clientId: norish
  secretName: norish-gate
  secretKey: client-secret
  adminGroup: admins

storageClass: local-path

norish:
  image:
    repository: docker.io/norishapp/norish
    tag: "v0.26.0-beta"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

postgres:
  image:
    repository: docker.io/library/postgres
    tag: 18.6-alpine
  user: norish
  database: norish
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

valkey:
  image:
    repository: docker.io/valkey/valkey
    tag: 9.1.3-alpine
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Text and photo AI. Norish copies this into its database on first boot.
# The model is the one Ollama already pulls for structured output.
ai:
  enabled: true
  provider: ollama
  endpoint: http://ollama.ai.svc.cluster.local:11434
  model: gemma3:12b

# Video import downloads a video and transcribes it. Leave it off.
video:
  enabled: false

# Renders recipe pages for URL imports. ClusterIP only: the CDP port can drive the browser.
obscura:
  image:
    repository: docker.io/norishapp/obscura
    tag: 0.2.5-norish.1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 2Gi
