apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "norish.labels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "norish.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # 17 binaries, used once to dump the old data directory. No-op after that.
      initContainers:
        - name: migrate
          image: docker.io/library/postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "/migrate.sh"]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: migrate
              mountPath: /migrate.sh
              subPath: migrate.sh
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Postgres 18 keeps the data directory under this path.
            - name: data
              mountPath: /var/lib/postgresql
            - name: migrate
              mountPath: /docker-entrypoint-initdb.d/10-restore.sh
              subPath: restore.sh
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: norish-postgres
        - name: migrate
          configMap:
            name: postgres-migrate
            defaultMode: 0555
