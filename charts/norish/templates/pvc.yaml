{{- $sc := .Values.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: norish-uploads
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: norish
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.norish.persistence.size }}
---
# Left out of Velero. Database backup is CloudNativePG.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: norish-postgres
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
    helios.luisbeu.de/backup: skip
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
---
# The cache is rebuilt, so the claim is left out of Velero.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: norish-valkey
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
    helios.luisbeu.de/backup: skip
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.valkey.persistence.size }}
