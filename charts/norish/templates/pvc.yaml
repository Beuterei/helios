{{- $sc := .Values.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: norish-uploads
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: norish
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.norish.persistence }}
---
