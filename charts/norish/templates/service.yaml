apiVersion: v1
kind: Service
metadata:
  name: norish
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: norish
spec:
  selector:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: norish
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  selector:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: obscura
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: obscura
spec:
  selector:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: obscura
  ports:
    - name: cdp
      port: 9222
      targetPort: cdp
