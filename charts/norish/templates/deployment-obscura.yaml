# No Ingress, because the CDP port can drive the browser.
# The token is the lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obscura
  labels:
    {{- include "norish.labels" . | nindent 4 }}
    app.kubernetes.io/component: obscura
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "norish.labels" . | nindent 6 }}
      app.kubernetes.io/component: obscura
  template:
    metadata:
      labels:
        {{- include "norish.labels" . | nindent 8 }}
        app.kubernetes.io/component: obscura
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obscura
          image: "{{ .Values.obscura.image.repository }}:{{ .Values.obscura.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: OBSCURA_CDP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: OBSCURA_CDP_TOKEN
          ports:
            - name: cdp
              containerPort: 9222
          startupProbe:
            tcpSocket:
              port: cdp
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: cdp
            periodSeconds: 10
          resources:
            {{- toYaml .Values.obscura.resources | nindent 12 }}
