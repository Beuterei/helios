# Stateless.
# The client secret and the cookie secret are that namespace's gate Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oauth2-proxy.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oauth2-proxy.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.issuer }}
            - --redirect-url=https://{{ required "host is required" .Values.host }}/oauth2/callback
            - --upstream=http://{{ required "upstream is required" .Values.upstream }}/
            - "--email-domain=*"
            # Pocket ID leaves email_verified false.
            # The passkey is the check.
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --oidc-groups-claim=groups
            {{- if not .Values.groups }}
            {{- fail "groups is required" }}
            {{- end }}
            {{- range .Values.groups }}
            - --allowed-group={{ . }}
            {{- end }}
            {{- range .Values.skipAuthRoutes }}
            - --skip-auth-route={{ . | quote }}
            {{- end }}
            - --skip-provider-button=true
            # Leaves an existing Pocket ID session in place.
            - --approval-prompt=auto
            - --reverse-proxy=true
            - --trusted-proxy-ip={{ .Values.trustedProxyCIDR }}
            # Pocket ID issues a refresh token on sign-in and rechecks groups on refresh.
            # The refresh follows the access token lifetime, and the cookie expiry ends the session.
            - --cookie-refresh=1h
            - --cookie-expire=24h
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --pass-basic-auth=false
            - --pass-user-headers=false
            - --upstream-timeout=0s
            - --silence-ping-logging=true
            - --http-address=0.0.0.0:4180
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: {{ required "clientId is required" .Values.clientId | quote }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "clientSecretName is required" .Values.clientSecretName }}
                  key: {{ required "clientSecretKey is required" .Values.clientSecretKey }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "cookieSecretName is required" .Values.cookieSecretName }}
                  key: {{ required "cookieSecretKey is required" .Values.cookieSecretKey }}
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
