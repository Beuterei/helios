# Traefik on the LAN.
# cloudflared only when this gate is a tunnel origin.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oauth2-proxy
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oauth2-proxy.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        {{- if .Values.tunnel }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              pod: cloudflared
        {{- end }}
      ports:
        - protocol: TCP
          port: 4180
---
# The app container accepts its HTTP port only from this gate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ required "app.name is required" (dig "name" "" (.Values.app | default dict)) }}-from-oauth2-proxy
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ required "app.name is required" (dig "name" "" (.Values.app | default dict)) }}
      app.kubernetes.io/component: {{ required "app.component is required" (dig "component" "" (.Values.app | default dict)) }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: {{ required "app.port is required" (dig "port" "" (.Values.app | default dict)) }}
