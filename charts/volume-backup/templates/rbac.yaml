# Freezing is done on the node, not through this role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-backup
  labels:
    {{- include "volume-backup.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volume-backup
  labels:
    {{- include "volume-backup.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volume-backup
  labels:
    {{- include "volume-backup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volume-backup
subjects:
  - kind: ServiceAccount
    name: volume-backup
    namespace: {{ .Release.Namespace }}
