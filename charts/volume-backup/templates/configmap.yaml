apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-backup
  labels:
    {{- include "volume-backup.labels" . | nindent 4 }}
data:
  exclude: |
    {{- range .Values.exclude }}
    {{ .namespace }}/{{ .claim }}
    {{- end }}
  lib.sh: |
{{ .Files.Get "scripts/lib.sh" | indent 4 }}
  backup.sh: |
{{ .Files.Get "scripts/backup.sh" | indent 4 }}
  prune.sh: |
{{ .Files.Get "scripts/prune.sh" | indent 4 }}
  check.sh: |
{{ .Files.Get "scripts/check.sh" | indent 4 }}
  thaw.sh: |
{{ .Files.Get "scripts/thaw.sh" | indent 4 }}
  restore.sh: |
{{ .Files.Get "scripts/restore.sh" | indent 4 }}
