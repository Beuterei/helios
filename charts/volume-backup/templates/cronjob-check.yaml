# Does not create the repository.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-check
  labels:
    {{- include "volume-backup.labels" . | nindent 4 }}
    app.kubernetes.io/component: check
spec:
  schedule: {{ .Values.check.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "volume-backup.labels" . | nindent 12 }}
            app.kubernetes.io/component: check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: restic
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/check.sh", {{ .Values.check.args | quote }}]
              envFrom:
                - secretRef:
                    name: {{ .Values.secretName }}
              env:
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.s3.region | quote }}
                - name: AWS_S3_FORCE_PATH_STYLE
                  value: {{ .Values.s3.forcePathStyle | quote }}
                - name: TZ
                  value: {{ .Values.timeZone | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: lock
                  mountPath: /run/lock
          volumes:
            - name: scripts
              configMap:
                name: volume-backup
            - name: lock
              hostPath:
                path: {{ .Values.hostPath.lock }}
                type: DirectoryOrCreate
