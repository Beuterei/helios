# Kubernetes CronJobs own the schedule.
image:
  repository: docker.io/mazzolino/restic
  tag: "1.8"

# alpine/kubectl has no tag for the cluster's exact patch release.
# The binary is copied out of the image, and registry.k8s.io/kubectl has no shell and no cp.
kubectl:
  repository: docker.io/alpine/kubectl
  tag: "1.35.4"

timeZone: Europe/Berlin

secretName: backup-s3

# Not credentials.
# Path style is on for an S3-compatible endpoint.
s3:
  region: us-east-1
  forcePathStyle: "true"

# The backup script tags each snapshot with its namespace.
backup:
  schedule: "0 5 * * *"

# Runs after the backup.
prune:
  schedule: "0 6 * * 0"

check:
  schedule: "0 7 * * *"
  args: "--read-data-subset=10%"

# Set by task backup:restore.
# Empty means Flux does not create a restore Job.
restore:
  app: ""
  snapshot: latest

hostPath:
  storage: /var/lib/rancher/k3s/storage
  copy: /var/lib/restic-copy
  cgroup: /sys/fs/cgroup
  lock: /var/lib/restic-lock

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi
