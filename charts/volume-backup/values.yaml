# mazzolino/restic runs cron itself. Tag matches the compose file.
image:
  repository: docker.io/mazzolino/restic
  tag: "1.8"

# Static client used to list claims and pods. This node is amd64.
kubectl:
  version: v1.35.8
  sha256: 874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf

timeZone: Europe/Berlin

# Six fields: seconds, then minute, hour, day, month, weekday.
backup:
  cron: "0 0 5 * * *"
  runOnStartup: "true"
  args: "--tag k3s-volumes --host helios --exclude *.tmp --verbose"
  forgetArgs: "--keep-last 30 --keep-daily 7 --keep-weekly 5 --keep-monthly 12"

prune:
  cron: "0 0 6 * * *"

check:
  cron: "0 0 7 * * *"
  args: "--read-data-subset=10%"

secretName: backup-s3

# Not credentials. Path style is on for an S3-compatible endpoint.
s3:
  region: us-east-1
  forcePathStyle: "true"

storageHostPath: /var/lib/rancher/k3s/storage
copyHostPath: /var/lib/restic-copy
cgroupHostPath: /sys/fs/cgroup
containerdSocket: /run/k3s/containerd/containerd.sock

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi
