secretName: paperless

# Open WebUI searches the archive through this adapter. Token is Secret paperless-api-token.
rag:
  enabled: true
  image:
    repository: docker.io/library/python
    tag: 3.12-alpine
  tokenSecret: paperless-api-token
  tokenKey: token
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

ingress:
  className: traefik
  host: paperless.luisbeu.de
  # Wildcard, reflected from namespace cert-manager.
  tlsSecret: luisbeu-de-tls

storageClass: local-path

paperless:
  image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: "3.4.1"
  timeZone: Europe/Berlin
  ocrLanguage: deu+eng
  # Paperless wants "1", not a YAML boolean.
  consumer:
    barcodes: "1"
    asnBarcode: "1"
    inotifyDelay: "5"
  # Same storage layout as the compose file.
  filenameFormat: "{{ owner_username }}/{{ created_year }}/{{ created_month }}/{{ correspondent }}/{{ asn }} - {{ title }}"
  # Drop placeholders that resolve to none, such as a missing correspondent.
  filenameFormatRemoveNone: true
  # Native AI (3.0+). Suggestions, auto-tag workflows, and document chat.
  # Model is pulled on the Ollama release. Internal URL must stay allowed.
  ai:
    enabled: true
    backend: ollama
    endpoint: http://ollama.ai.svc.cluster.local:11434
    model: gemma3:12b
    embeddingBackend: ollama
    embeddingModel: bge-m3
    requestTimeout: "300"
    outputLanguage: German
  persistence:
    data: 2Gi
    media: 50Gi
    consume: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

postgres:
  image:
    repository: docker.io/library/postgres
    tag: 18.6-alpine
  persistence: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Paperless 3.4 uses Valkey as the broker. The compose repo still says Redis.
broker:
  image:
    repository: docker.io/valkey/valkey
    tag: 9-alpine
  persistence: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

gotenberg:
  image:
    repository: docker.io/gotenberg/gotenberg
    tag: 8.39.0
  # Office and mail conversion. Chromium does not load remote content.
  args:
    - gotenberg
    - --chromium-disable-javascript=true
    - --chromium-allow-list=^file:///tmp/.*
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

tika:
  image:
    repository: docker.io/apache/tika
    tag: 3.3.3.0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
