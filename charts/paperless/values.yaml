secretName: paperless

# Sign-in is Pocket ID.
# The Paperless gate SOPS secret holds the client secret.
oidc:
  enabled: true
  host: auth.luisbeu.de
  providerId: pocket-id
  name: Pocket ID
  clientId: paperless
  secretName: paperless-gate
  secretKey: client-secret
  # Django group for a normal sign-in.
  # Must match the Pocket ID group name.
  defaultGroup: paperless
  # Group name that becomes a superuser.
  # Must match the Pocket ID group name.
  adminGroup: admins
  # Created on startup.
  # Sign-in keeps membership for these names only.
  # user: the archive (documents, tags, types, views) and read-only settings.
  # admin: every permission the Paperless UI can show.
  groups:
    - name: paperless
      role: user
    - name: admins
      role: admin

# WebDAV keeps its own Ingress.
publicURL: https://paperless.luisbeu.de
ingress:
  className: traefik
  tlsSecret: luisbeu-de-tls

storageClass: local-path

paperless:
  image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: "3.4.1"
  timeZone: Europe/Berlin
  ocrLanguage: deu+eng
  # Paperless wants "1", not a YAML boolean.
  consumer:
    barcodes: "1"
    asnBarcode: "1"
    inotifyDelay: "5"
  filenameFormat: "{{ owner_username }}/{{ created_year }}/{{ created_month }}/{{ correspondent }}/{{ asn }} - {{ title }}"
  # Drop placeholders that resolve to none, such as a missing correspondent.
  filenameFormatRemoveNone: true
  # Native AI: suggestions, auto-tag workflows, and document chat.
  # The Ollama release pulls the models.
  # The internal URL must stay allowed.
  ai:
    enabled: true
    backend: ollama
    endpoint: http://ollama.ai.svc.cluster.local:11434
    model: gemma3:12b
    embeddingBackend: ollama
    embeddingModel: bge-m3
    requestTimeout: "300"
    outputLanguage: German
  persistence:
    data: 2Gi
    media: 50Gi
    consume: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

postgres:
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "18.6"
  user: paperless
  database: paperless
  # CloudNativePG reads the keys username and password.
  secretName: paperless-postgres
  persistence:
    size: 10Gi
  # 04:00 Europe/Berlin. The operator clock is that zone.
  # An hour before the Velero daily backup.
  backup:
    destinationPath: s3://backup-lb/cnpg/paperless
    endpointURL: https://nbg1.your-objectstorage.com
    schedule: "0 0 4 * * *"
    retentionPolicy: 30d
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Valkey is the Paperless task broker.
broker:
  image:
    repository: docker.io/valkey/valkey
    tag: 9.1.3-alpine
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

gotenberg:
  image:
    repository: docker.io/gotenberg/gotenberg
    tag: 8.39.0
  # Office and mail conversion.
  # Chromium does not load remote content.
  args:
    - gotenberg
    - --chromium-disable-javascript=true
    - --chromium-allow-list=^file:///tmp/.*
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

tika:
  image:
    repository: docker.io/apache/tika
    tag: 3.3.3.0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# Uploads land in the Paperless consume claim.
# Runs as the same uid as Paperless.
webdav:
  image:
    repository: ghcr.io/hacdias/webdav
    tag: "v5.17.3"
  secretName: paperless-webdav
  host: webdav-paperless.luisbeu.de
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
