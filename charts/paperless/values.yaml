# Current releases. The compose repo pins Paperless 2.19, Postgres 18.1,
# Redis 8.0, Gotenberg 8.24, and Tika 3.2.3.0.
secretName: paperless

ingress:
  className: traefik
  host: paperless.luisbeu.de
  tlsSecret: paperless-luisbeu-de-tls

storageClass: local-path

paperless:
  image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: "3.4.1"
  timeZone: Europe/Berlin
  ocrLanguage: deu+eng
  # Same storage layout as the compose file.
  filenameFormat: "{{ owner_username }}/{{ created_year }}/{{ created_month }}/{{ correspondent }}/{{ asn }} - {{ title }}"
  persistence:
    data: 2Gi
    media: 50Gi
    consume: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

postgres:
  image:
    repository: docker.io/library/postgres
    tag: 18.6-alpine
  persistence: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Paperless 3.4 uses Valkey as the broker. The compose repo still says Redis.
broker:
  image:
    repository: docker.io/valkey/valkey
    tag: 9-alpine
  persistence: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

gotenberg:
  image:
    repository: docker.io/gotenberg/gotenberg
    tag: 8.39.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

tika:
  image:
    repository: docker.io/apache/tika
    tag: 3.3.3.0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
