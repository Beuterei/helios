{{- $sc := .Values.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.paperless.persistence.data }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.paperless.persistence.media }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.paperless.persistence.consume }}
---
# The queue is rebuilt, so the claim is left out of Velero.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-broker
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
    helios.luisbeu.de/backup: skip
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.broker.persistence.size }}
