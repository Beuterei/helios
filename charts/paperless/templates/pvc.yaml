{{- $sc := .Values.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $sc }}
  resources:
    requests:
      storage: {{ .Values.paperless.persistence.data }}
---
