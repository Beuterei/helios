apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-webdav
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: webdav
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.webdav.host }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.webdav.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-webdav
                port:
                  name: http
