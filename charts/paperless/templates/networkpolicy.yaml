apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# WebDAV is not behind the gate.
# Traefik is its only caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webdav-from-traefik
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paperless.labels" . | nindent 6 }}
      app.kubernetes.io/component: webdav
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 6065
