apiVersion: v1
kind: Service
metadata:
  name: paperless
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
spec:
  selector:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  selector:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  selector:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: tika
spec:
  selector:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: tika
  ports:
    - name: http
      port: 9998
      targetPort: http
{{- if .Values.rag.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-rag
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
spec:
  selector:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
