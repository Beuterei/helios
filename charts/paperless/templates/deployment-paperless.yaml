apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperless.labels" . | nindent 6 }}
      app.kubernetes.io/component: paperless
  template:
    metadata:
      labels:
        {{- include "paperless.labels" . | nindent 8 }}
        app.kubernetes.io/component: paperless
    spec:
      # The Service is named paperless, so Kubernetes would set
      # PAPERLESS_PORT to tcp://<ip>:8000. Granian reads that as its bind port.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: paperless
          image: "{{ .Values.paperless.image.repository }}:{{ .Values.paperless.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_REDIS
              value: redis://broker:6379
            - name: PAPERLESS_DBHOST
              value: postgres
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_URL
              value: https://{{ .Values.ingress.host }}
            - name: PAPERLESS_TIME_ZONE
              value: {{ .Values.paperless.timeZone | quote }}
            - name: PAPERLESS_OCR_LANGUAGE
              value: {{ .Values.paperless.ocrLanguage | quote }}
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://gotenberg:3000
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://tika:9998
            - name: PAPERLESS_FILENAME_FORMAT
              value: {{ .Values.paperless.filenameFormat | quote }}
            - name: PAPERLESS_FILENAME_FORMAT_REMOVE_NONE
              value: {{ .Values.paperless.filenameFormatRemoveNone | quote }}
            - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
              value: {{ .Values.paperless.consumer.barcodes | quote }}
            - name: PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE
              value: {{ .Values.paperless.consumer.asnBarcode | quote }}
            - name: PAPERLESS_CONSUMER_INOTIFY_DELAY
              value: {{ .Values.paperless.consumer.inotifyDelay | quote }}
            {{- if .Values.paperless.ai.enabled }}
            - name: PAPERLESS_AI_ENABLED
              value: "true"
            - name: PAPERLESS_AI_LLM_BACKEND
              value: {{ .Values.paperless.ai.backend | quote }}
            - name: PAPERLESS_AI_LLM_ENDPOINT
              value: {{ .Values.paperless.ai.endpoint | quote }}
            - name: PAPERLESS_AI_LLM_MODEL
              value: {{ .Values.paperless.ai.model | quote }}
            - name: PAPERLESS_AI_LLM_EMBEDDING_BACKEND
              value: {{ .Values.paperless.ai.embeddingBackend | quote }}
            - name: PAPERLESS_AI_LLM_EMBEDDING_MODEL
              value: {{ .Values.paperless.ai.embeddingModel | quote }}
            - name: PAPERLESS_AI_LLM_REQUEST_TIMEOUT
              value: {{ .Values.paperless.ai.requestTimeout | quote }}
            - name: PAPERLESS_AI_LLM_OUTPUT_LANGUAGE
              value: {{ .Values.paperless.ai.outputLanguage | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: PAPERLESS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.secretName }}
                  key: {{ .Values.oidc.secretKey }}
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: {{ printf "{\"openid_connect\":{\"OAUTH_PKCE_ENABLED\":true,\"APPS\":[{\"provider_id\":\"authentik\",\"name\":\"authentik\",\"client_id\":\"%s\",\"secret\":\"$(PAPERLESS_OIDC_CLIENT_SECRET)\",\"settings\":{\"server_url\":\"https://%s/application/o/%s/.well-known/openid-configuration\",\"fetch_userinfo\":true}}],\"SCOPE\":[\"openid\",\"profile\",\"email\"]}}" .Values.oidc.clientId .Values.oidc.host .Values.oidc.clientId | quote }}
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: https://{{ .Values.oidc.host }}/application/o/{{ .Values.oidc.clientId }}/end-session/
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "true"
            {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            {{- toYaml .Values.paperless.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
