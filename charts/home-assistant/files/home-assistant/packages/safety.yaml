automation:
  # The phone alarm stream and the kiosk speaker both announce it, so it is heard at night.
  - id: leak_detected
    alias: Leak Detected
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.leak_bathroom_water_leak
          - binary_sensor.leak_kitchen_water_leak
        to: "on"
    variables:
      leak_message: "A leak has been detected in area {{ area_name(trigger.entity_id) }}"
    actions:
      - action: notify.mobile_app_luis_handy
        data:
          message: TTS
          data:
            ttl: 0
            priority: high
            media_stream: alarm_stream_max
            tts_text: "{{ leak_message }}"
      - action: switch.turn_on
        target:
          entity_id: switch.kiosk_bildschirm
      - action: media_player.volume_set
        target:
          entity_id: media_player.kiosk
        data:
          volume_level: 1
      - action: notify.send_message
        target:
          entity_id: notify.kiosk_text_zu_sprache
        data:
          message: "{{ leak_message }}"
      - action: notify.mobile_app_luis_handy
        data:
          title: Leak Detected
          message: "{{ leak_message }}"
          data:
            ttl: 0
            priority: high
