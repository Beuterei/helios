# An init container copies this file over the claim copy on every start, so a rename belongs here.
# The network key, the MQTT password, and the frontend token come from env vars.
version: 5

homeassistant:
  enabled: true

frontend:
  enabled: true
  port: 8080
  url: https://zigbee.luisbeu.de

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
  user: zigbee2mqtt

serial:
  port: /dev/zigbee
  adapter: deconz

# The adapter compares these and the key with the network stored on the ConBee.
# Any difference makes it rewrite the stick, and every paired device drops off.
# These are the Zigbee2MQTT defaults, which the old config never overrode.
advanced:
  pan_id: 6754
  ext_pan_id: [221, 221, 221, 221, 221, 221, 221, 221]
  channel: 11
  log_output:
    - console

availability:
  enabled: true

