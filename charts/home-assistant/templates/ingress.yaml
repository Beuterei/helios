{{- range $name, $url := dict "home-assistant" .Values.publicURL "zigbee2mqtt" .Values.zigbee2mqtt.publicURL }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "home-assistant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $url | trimPrefix "https://" }}
      secretName: {{ $.Values.ingress.tlsSecret }}
  rules:
    - host: {{ $url | trimPrefix "https://" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
