apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: home-assistant
spec:
  selector:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: zigbee2mqtt
spec:
  selector:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: zigbee2mqtt
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
spec:
  selector:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
# The Nuki lock reaches the broker from the LAN.
# Nuki speaks plain MQTT on this port only, so the port and the missing TLS are fixed.
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-lan
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
spec:
  type: LoadBalancer
  selector:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
