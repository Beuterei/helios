# The Pocket ID SOPS secret holds the encryption key.
# Change it before the claim exists.
secretName: pocket-id

image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: "v2.19.2"

publicURL: https://auth.luisbeu.de
timeZone: Europe/Berlin
priorityClassName: edge
# Traefik and cloudflared run in the pod CIDR.
# A direct caller outside it cannot set the client IP.
trustProxy: 10.42.0.0/16

ingress:
  className: traefik
  tlsSecret: luisbeu-de-tls

storageClass: local-path
persistence:
  size: 1Gi

postgres:
  image:
    repository: docker.io/library/postgres
    tag: 18.6-alpine
  user: pocketid
  database: pocketid
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
