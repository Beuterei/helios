# The Pocket ID SOPS secret holds the encryption key.
# The encryption key has to be set before the database exists.
secretName: pocket-id

image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: "v2.19.2"

publicURL: https://auth.luisbeu.de
timeZone: Europe/Berlin
priorityClassName: edge
# Traefik and cloudflared run in the pod CIDR.
# A direct caller outside it cannot set the client IP.
trustProxy: 10.42.0.0/16

ingress:
  className: traefik
  tlsSecret: luisbeu-de-tls

storageClass: local-path
persistence:
  size: 1Gi

postgres:
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "18.6"
  user: pocketid
  database: pocketid
  # CloudNativePG reads the keys username and password.
  secretName: pocket-id-postgres
  persistence:
    size: 1Gi
  # 04:00 Europe/Berlin. The operator clock is that zone.
  # An hour before the Velero daily backup.
  backup:
    destinationPath: s3://backup-lb/cnpg/pocket-id
    endpointURL: https://nbg1.your-objectstorage.com
    schedule: "0 0 4 * * *"
    retentionPolicy: 30d
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
