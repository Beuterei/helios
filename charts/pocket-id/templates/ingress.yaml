apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocket-id
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.publicURL | trimPrefix "https://" }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.publicURL | trimPrefix "https://" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocket-id
                port:
                  name: http
