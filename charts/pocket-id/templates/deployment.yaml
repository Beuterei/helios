# Uploads are files on the claim, so a second replica would split them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pocket-id.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pocket-id.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pocket-id
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_URL
              value: {{ .Values.publicURL | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            - name: ALLOW_INSECURE_CALLBACK_URLS
              value: "false"
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: VERSION_CHECK_DISABLED
              value: "true"
            - name: TZ
              value: {{ .Values.timeZone | quote }}
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            # The server has no TLS. The password is substituted from the env var above.
            - name: DB_CONNECTION_STRING
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
          ports:
            - name: http
              containerPort: 1411
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id
