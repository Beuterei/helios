apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocket-id
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}