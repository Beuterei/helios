# Per-node plugin: register host CDI devices with the kubelet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      # Must run even when the node is under pressure.
      priorityClassName: system-node-critical
      containers:
        - name: plugin
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command:
            - /generic-cdi-plugin
            - {{ .Values.cdiSpec }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
            - name: cdi
              mountPath: {{ dir .Values.cdiSpec }}
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: cdi
          hostPath:
            path: {{ dir .Values.cdiSpec }}
