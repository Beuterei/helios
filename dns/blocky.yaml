# Queries leave over DoH, and nothing is written to a query log.
# LAN devices query the LoadBalancer on this node.
# CoreDNS forwards other names to the pinned ClusterIP.
# The mapping answers with this node's LAN address, so the gateway reserves that address.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: network
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: blocky
      version: 11.42.0
      sourceRef:
        kind: HelmRepository
        name: johanneskastl
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart omits clusterIP on LoadBalancer Services.
  # The pin lets CoreDNS forward here without depending on a newly allocated address.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: blocky
            patch: |-
              - op: add
                path: /spec/clusterIP
                value: "10.43.38.254"
        # TODO: drop the digest pin once a release picks any published DS.
        # The chart has no image.digest.
        images:
          - name: ghcr.io/0xerr0r/blocky
            digest: sha256:98627c3923fc720537dfce3da4b27b8f89dd57549555128f564fe26614a713a3
  values:
    image:
      repository: ghcr.io/0xerr0r/blocky
      # TODO: pin a release tag once a release picks any published DS.
      # The latest release picks one DS and requires that KSK to sign DNSKEY.
      # .io publishes two DS records but signs with only one, so the TLD SERVFAILs when the other is chosen first.
      tag: development

    env:
      TZ: Europe/Berlin

    # The chart renders this with tpl.
    # The hash is part of the pod template, so a config change rolls the pod.
    # The subPath mount would not.
    podAnnotations:
      checksum/config: "{{ .Values.config | sha256sum }}"

    service:
      dns:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
            targetPort: 53
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
            targetPort: 53

    config: |
      upstreams:
        init:
          strategy: blocking
        groups:
          default:
            - https://dns.quad9.net/dns-query
            - https://dns.digitale-gesellschaft.ch/dns-query
        strategy: parallel_best
        timeout: 2s

      # IP-pinned DoH, so bootstrap uses neither plaintext DNS nor the resolver Blocky replaces.
      # Quad9 and Digitale Gesellschaft do not speak unencrypted DNS.
      bootstrapDns:
        - upstream: https://dns.quad9.net/dns-query
          ips:
            - 9.9.9.9
            - 149.112.112.112
        - upstream: https://dns.digitale-gesellschaft.ch/dns-query
          ips:
            - 185.95.218.42
            - 185.95.218.43

      dnssec:
        validate: true

      filtering:
        queryTypes:
          - ANY
          - AXFR
          - IXFR

      customDNS:
        customTTL: 1h
        filterUnmappedTypes: true
        mapping:
          auth.luisbeu.de: 192.168.1.151
          chat.luisbeu.de: 192.168.1.151
          paperless.luisbeu.de: 192.168.1.151
          recipe.luisbeu.de: 192.168.1.151
          webdav-paperless.luisbeu.de: 192.168.1.151

      rebindingProtection:
        enable: true
        allowedDomains:
          - auth.luisbeu.de
          - chat.luisbeu.de
          - paperless.luisbeu.de
          - recipe.luisbeu.de
          - webdav-paperless.luisbeu.de

      blocking:
        denylists:
          ads:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt
          malware:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini.txt
        clientGroupsBlock:
          default:
            - ads
            - malware
        blockType: nxDomain
        blockTTL: 5m
        loading:
          strategy: blocking
          refreshPeriod: 24h
          downloads:
            timeout: 60s
            attempts: 5
            cooldown: 10s

      caching:
        minTime: 5m
        maxTime: 1h
        prefetching: false

      queryLog:
        type: none

      log:
        level: info
        privacy: true

      ports:
        dns:
          - 53

    priorityClassName: edge

    # Headroom for a blocklist reload.
    # Without requests the pod is BestEffort.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
