apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: luisbeu-de
  namespace: cert-manager
spec:
  secretName: luisbeu-de-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - "*.luisbeu.de"
  # Reflector copies the secret only into namespaces that serve an Ingress.
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "ai,paperless,pocket-id,norish"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "ai,paperless,pocket-id,norish"
