apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: luisbeu-de
  namespace: ai
spec:
  secretName: luisbeu-de-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "*.luisbeu.de"
  # Paperless serves its own Ingress, so it needs this secret in its namespace.
  # Reflector copies it there and follows renewals. A separate name would wait
  # on DNS-01, which port 53 from this network does not answer.
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "paperless"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "paperless"
