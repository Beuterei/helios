# Uses the k3s kubeconfig unless KUBECONFIG is set.
version: "3"

env:
  KUBECONFIG: '{{.KUBECONFIG | default "/etc/rancher/k3s/k3s.yaml"}}'
  # flux-local lives in the user local bin.
  # The other tools are on the default PATH.
  PATH: '{{env "HOME"}}/.local/bin:{{env "PATH"}}'

tasks:
  build:
    desc: Render each layer to catch mistakes before pushing
    cmds:
      - kustomize build namespaces > /dev/null
      - kustomize build sources > /dev/null
      - kustomize build dns > /dev/null
      - kustomize build platform > /dev/null
      - kustomize build platform/cert-manager > /dev/null
      - kustomize build platform/cloudflared > /dev/null
      - kustomize build platform/velero > /dev/null
      - kustomize build platform/cloudnative-pg > /dev/null
      - helm template generic-cdi-plugin charts/generic-cdi-plugin --namespace kube-system > /dev/null
      - helm template paperless charts/paperless --namespace paperless > /dev/null
      - helm template pocket-id charts/pocket-id --namespace pocket-id > /dev/null
      - helm template norish charts/norish --namespace norish > /dev/null
      - helm template oauth2-proxy charts/oauth2-proxy --namespace norish -f charts/oauth2-proxy/ci/test-values.yaml > /dev/null
      - helm template oauth2-proxy charts/oauth2-proxy --namespace norish -f charts/oauth2-proxy/ci/test-values.yaml --set tunnel=true > /dev/null
      - kustomize build apps > /dev/null
      - kustomize build certs > /dev/null
      - kustomize build secrets > /dev/null
      - shellcheck charts/paperless/files/default-groups.sh
      - test -z "$(grep -L '^sops:' secrets/*.enc.yaml)"
      - flux-local test --enable-helm --path clusters/helios

  diff:
    desc: Compare the working tree with what Flux has applied
    cmds:
      # flux diff exits 1 when there is a diff, so that counts as success.
      - flux diff kustomization flux-system --path ./clusters/helios || [ $? -eq 1 ]
      - flux diff kustomization namespaces --path ./namespaces || [ $? -eq 1 ]
      - flux diff kustomization sources --path ./sources || [ $? -eq 1 ]
      - flux diff kustomization dns --path ./dns || [ $? -eq 1 ]
      - flux diff kustomization platform --path ./platform || [ $? -eq 1 ]
      - flux diff kustomization cert-manager --path ./platform/cert-manager || [ $? -eq 1 ]
      - flux diff kustomization cloudflared --path ./platform/cloudflared || [ $? -eq 1 ]
      - flux diff kustomization backups --path ./platform/velero || [ $? -eq 1 ]
      - flux diff kustomization cloudnative-pg --path ./platform/cloudnative-pg || [ $? -eq 1 ]
      - flux diff kustomization apps --path ./apps || [ $? -eq 1 ]
      - flux diff kustomization certs --path ./certs || [ $? -eq 1 ]

  reconcile:
    desc: Make Flux fetch the pushed commit and apply it now
    cmds:
      - flux reconcile kustomization flux-system --with-source

  status:
    desc: Show what Flux has applied
    cmds:
      - flux get kustomizations
      - flux get helmreleases -A

  sops:encrypt:
    desc: Encrypt secrets/<name>.yaml to secrets/<name>.enc.yaml and delete the plaintext
    cmds:
      - |
        set -e
        out="{{trimSuffix ".yaml" .CLI_ARGS}}.enc.yaml"
        sops --encrypt "{{.CLI_ARGS}}" > "$out.tmp"
        mv "$out.tmp" "$out"
        rm "{{.CLI_ARGS}}"

  sops:edit:
    desc: Edit secrets/<name>.enc.yaml in $EDITOR and re-encrypt it
    interactive: true
    cmds:
      - sops {{.CLI_ARGS}}

  sops:decrypt:
    desc: Print secrets/<name>.enc.yaml. Writes no file.
    cmds:
      - sops --decrypt {{.CLI_ARGS}}

  backup:restore:
    desc: "Restore one namespace from Velero. Args: namespace [backup name]"
    cmds:
      - |
        set -euo pipefail
        set -- {{.CLI_ARGS}}
        ns=${1:?namespace}
        backup=${2:-}
        # Restored pods write the backed-up files into the claims they mount.
        # HelmReleases stay suspended until that finishes, then they start the apps.
        flux suspend helmrelease --all -n "$ns"
        kubectl -n "$ns" delete deploy,sts --all --wait=true --timeout=10m
        kubectl -n "$ns" wait --for=delete pod -l app.kubernetes.io/managed-by=Helm --timeout=10m
        kubectl -n velero delete restore "restore-${ns}" --ignore-not-found
        if [ -n "$backup" ]; then
          from_flag=--from-backup
          from_value=$backup
        else
          from_flag=--from-schedule
          from_value=velero-daily
        fi
        # Volume data is restored only when claims and volumes are included too.
        # --wait exits 0 when the restore fails, so the phase still decides.
        velero restore create "restore-${ns}" --namespace velero \
          "$from_flag" "$from_value" \
          --include-namespaces "$ns" \
          --include-resources pods,persistentvolumeclaims,persistentvolumes \
          --item-operation-timeout 8h \
          --wait
        phase=$(kubectl -n velero get restore "restore-${ns}" -o jsonpath='{.status.phase}')
        if [ "$phase" != Completed ]; then
          printf 'restore %s is %s; HelmReleases in %s stay suspended\n' "restore-${ns}" "${phase:-unknown}" "$ns" >&2
          exit 1
        fi
        kubectl -n "$ns" delete pod --all --wait=true --timeout=10m
        flux resume helmrelease --all -n "$ns"
