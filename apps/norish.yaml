# Recipes for the household. Sign-in is Pocket ID.
# The master key, database password, and Obscura token are secrets/norish.enc.yaml.
# The client secret is secrets/pocket-id-sso.enc.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: norish
  namespace: norish
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./charts/norish
      # Chart version stays 0.1.0. ChartVersion would keep the first package.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
