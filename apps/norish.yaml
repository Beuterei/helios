# Sign-in is Pocket ID.
# The Norish SOPS secret holds the master key, database password, and Obscura token.
# The Norish gate SOPS secret holds the client secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: norish
  namespace: norish
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./charts/norish
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
