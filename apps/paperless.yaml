# Document archive. Same services as github.com/Beuterei/paperless-ngx.
# Image tags are the current releases.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: paperless
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./charts/paperless
      # Chart version stays 0.1.0. ChartVersion would keep the first package.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
