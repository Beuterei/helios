# LAN and cluster recursive DNS. Queries leave over DoH; nothing is
# written to a query log.
# LAN devices query the LoadBalancer at 192.168.1.151:53 (this node).
# CoreDNS forwards other names to ClusterIP 10.43.38.254.
# Reserve 192.168.1.151 on the gateway so LAN names keep resolving.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: network
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: blocky
      version: 11.42.0
      sourceRef:
        kind: HelmRepository
        name: johanneskastl
        namespace: flux-system
  # Chart omits clusterIP on LoadBalancer Services. Pin it so CoreDNS can
  # forward here without depending on a newly allocated address.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: blocky
            patch: |-
              - op: add
                path: /spec/clusterIP
                value: "10.43.38.254"
        # TODO: drop this digest pin when v0.36 is out.
        # Chart has no image.digest.
        images:
          - name: ghcr.io/0xerr0r/blocky
            digest: sha256:98627c3923fc720537dfce3da4b27b8f89dd57549555128f564fe26614a713a3
  values:
    image:
      repository: ghcr.io/0xerr0r/blocky
      # TODO: pin tag to v0.36. v0.35.0 picks one DS and requires that
      # KSK to sign DNSKEY. .io publishes DS 38690 and 57355 but signs
      # only with 57355, so the TLD (quay.io included) SERVFAILs when
      # 38690 is chosen first. #2293 is on main (v0.35.0-52-g501edc07).
      tag: development

    env:
      TZ: Europe/Berlin

    # The chart renders this with tpl. The hash is part of the pod template,
    # so a config change rolls the pod. The subPath mount would not.
    podAnnotations:
      checksum/config: "{{ .Values.config | sha256sum }}"

    service:
      dns:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
            targetPort: 53
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
            targetPort: 53

    config: |
      upstreams:
        init:
          strategy: blocking
        groups:
          default:
            - https://dns.quad9.net/dns-query
            - https://dns.digitale-gesellschaft.ch/dns-query
        strategy: parallel_best
        timeout: 2s

      # IP-pinned DoH so bootstrap does not use plaintext :53 or the
      # resolver we are replacing. Quad9 and Digitale Gesellschaft do not
      # speak unencrypted DNS.
      bootstrapDns:
        - upstream: https://dns.quad9.net/dns-query
          ips:
            - 9.9.9.9
            - 149.112.112.112
        - upstream: https://dns.digitale-gesellschaft.ch/dns-query
          ips:
            - 185.95.218.42
            - 185.95.218.43

      dnssec:
        validate: true

      filtering:
        queryTypes:
          - ANY
          - AXFR
          - IXFR

      customDNS:
        customTTL: 1h
        filterUnmappedTypes: true
        mapping:
          auth.luisbeu.de: 192.168.1.151
          chat.luisbeu.de: 192.168.1.151
          paperless.luisbeu.de: 192.168.1.151
          webdav-paperless.luisbeu.de: 192.168.1.151

      rebindingProtection:
        enable: true
        allowedDomains:
          - auth.luisbeu.de
          - chat.luisbeu.de
          - paperless.luisbeu.de
          - webdav-paperless.luisbeu.de

      blocking:
        denylists:
          ads:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt
          malware:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini.txt
        clientGroupsBlock:
          default:
            - ads
            - malware
        blockType: nxDomain
        blockTTL: 5m
        loading:
          strategy: blocking
          refreshPeriod: 24h
          downloads:
            timeout: 60s
            attempts: 5
            cooldown: 10s

      caching:
        minTime: 5m
        maxTime: 1h
        prefetching: false

      queryLog:
        type: none

      log:
        level: info
        privacy: true

      ports:
        dns:
          - 53
