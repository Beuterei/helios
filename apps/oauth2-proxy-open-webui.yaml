# LAN only.
# The upstream chart Ingress is off.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: ai
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/oauth2-proxy
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: open-webui
      component: open-webui
      port: 8080
    host: chat.luisbeu.de
    upstream: open-webui:80
    clientId: open-webui
    clientSecretName: open-webui-gate
    clientSecretKey: client-secret
    cookieSecretName: open-webui-gate
    cookieSecretKey: cookie-secret
    groups:
      - open_webui
      - admins
