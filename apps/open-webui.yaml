# Chat UI in front of in-cluster inference. Exposed via Traefik.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: ai
spec:
  interval: 1h
  chart:
    spec:
      chart: open-webui
      version: 17.4.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: "0.12.4"

    # Use the in-cluster inference service; do not run a bundled copy.
    ollama:
      enabled: false
    ollamaUrls:
      - http://ollama.ai.svc.cluster.local:11434

    pipelines:
      enabled: false

    enableOpenaiApi: false

    # Single replica; Redis is not needed for websockets.
    websocket:
      manager: ""
      redis:
        enabled: false

    ingress:
      enabled: true
      class: traefik
      host: chat.luisbeu.de
      tls: true
      existingSecret: luisbeu-de-tls

    persistence:
      size: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4Gi

    # API keys, restricted to model list and chat.
    extraEnvVars:
      - name: CORS_ALLOW_ORIGIN
        value: https://chat.luisbeu.de
      - name: ENABLE_API_KEYS
        value: "true"
      - name: ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS
        value: "true"
      - name: API_KEYS_ALLOWED_ENDPOINTS
        value: /api/models,/api/chat/completions
      # RAG uses in-cluster Ollama, not the default MiniLM in the UI pod.
      - name: RAG_EMBEDDING_ENGINE
        value: ollama
      - name: RAG_EMBEDDING_MODEL
        value: bge-m3
      - name: RAG_OLLAMA_BASE_URL
        value: http://ollama.ai.svc.cluster.local:11434
      # Paperless archive as an Open WebUI tool. On an existing PVC this
      # ConfigVar may already be stored; add the same URL under Admin → Tools if missing.
      - name: TOOL_SERVER_CONNECTIONS
        value: >-
          [{"url":"http://paperless-rag.paperless.svc.cluster.local:8080","path":"/openapi.json","auth_type":"none","config":{"enable":true},"info":{"id":"paperless","name":"Paperless","description":"Search the Paperless-ngx archive by text, tags, correspondent, document type, or date"}}]
      # Authentik. The client secret is reflected into this namespace.
      - name: WEBUI_URL
        value: https://chat.luisbeu.de
      - name: OAUTH_CLIENT_ID
        value: open-webui
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: authentik-sso
            key: open-webui
      - name: OAUTH_PROVIDER_NAME
        value: Authentik
      - name: OPENID_PROVIDER_URL
        value: https://auth.luisbeu.de/application/o/open-webui/.well-known/openid-configuration
      - name: OPENID_REDIRECT_URI
        value: https://chat.luisbeu.de/oauth/oidc/callback
      - name: OAUTH_SCOPES
        value: openid email profile
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: ENABLE_SIGNUP
        value: "false"
      - name: ENABLE_PASSWORD_AUTH
        value: "false"
      - name: ENABLE_PASSWORD_CHANGE_FORM
        value: "false"
      - name: ENABLE_OAUTH_ROLE_MANAGEMENT
        value: "true"
      - name: OAUTH_ROLES_CLAIM
        value: groups
      - name: OAUTH_ALLOWED_ROLES
        value: "*"
      - name: OAUTH_ADMIN_ROLES
        value: authentik Admins
