# The SOPS secret holds the YouTube TV screen id.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: isponsorblocktv
  namespace: isponsorblocktv
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: ./charts/isponsorblocktv
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
