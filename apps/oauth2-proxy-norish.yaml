# Session gate for Norish. The app chart does not publish the host.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: norish
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/oauth2-proxy
      # Chart version stays 0.1.0. ChartVersion would keep the first package.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: norish
      component: norish
      port: 3000
    host: recipe.luisbeu.de
    upstream: norish:3000
    clientId: norish
    clientSecretName: norish-gate
    clientSecretKey: client-secret
    cookieSecretName: norish-gate
    cookieSecretKey: cookie-secret
    groups:
      - norish
      - admins
    # The probe path only. A query string still matches.
    skipAuthRoutes:
      - "GET=^/api/v1/health/ready$"
    tunnel: true
