# Session gate for Norish. The app chart no longer publishes the host.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: norish
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/oauth2-proxy
      # Chart version stays 0.1.0. ChartVersion would keep the first package.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    tunnel: true
    host: recipe.luisbeu.de
    upstream: norish:3000
    clientId: norish
    clientSecretKey: norish
    cookieSecretKey: norish
    groups:
      - norish
      - admins
    app:
      name: norish
      component: norish
      port: 3000
