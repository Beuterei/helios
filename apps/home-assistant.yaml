# The Home Assistant SOPS secret holds the coordinates, the webhook id, and the hpm token.
# The Zigbee2MQTT and Mosquitto SOPS secrets hold the network key, the frontend token, and the broker passwords.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./charts/home-assistant
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
