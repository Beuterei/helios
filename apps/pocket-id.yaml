# Identity provider.
# Paperless, Open WebUI, and Norish sign in here. Their username forms are off.
# The encryption key is secrets/pocket-id.enc.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./charts/pocket-id
      # Chart version stays 0.1.0. ChartVersion would keep the first package.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
