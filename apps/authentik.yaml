# Identity provider.
# Local passwords on those apps stay available.
# The first account's email and password are secrets/authentik.enc.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: 2026.8.5
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: flux-system
  values:
    authentik:
      existingSecret:
        secretName: authentik

    global:
      env:
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_LOG_LEVEL
          value: info
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-postgresql
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        # Blueprint client secrets. The worker applies blueprints from env.
        - name: PAPERLESS_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-sso
              key: paperless
        - name: OPENWEBUI_OIDC_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-sso
              key: open-webui

    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - auth.luisbeu.de
        tls:
          - secretName: luisbeu-de-tls
            hosts:
              - auth.luisbeu.de

    worker:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-postgresql
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      primary:
        persistence:
          size: 8Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

    # The worker watches this directory and applies changes.
    additionalObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: authentik-blueprints
        data:
          sso.yaml: |
            version: 1
            metadata:
              name: helios-sso
            entries:
              - model: authentik_providers_oauth2.oauth2provider
                id: paperless
                identifiers:
                  name: Paperless
                attrs:
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                  client_type: confidential
                  client_id: paperless
                  client_secret: !Env PAPERLESS_OIDC_SECRET
                  redirect_uris:
                    - matching_mode: strict
                      url: https://paperless.luisbeu.de/accounts/oidc/authentik/login/callback/
                      redirect_uri_type: authorization
                  property_mappings:
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
              - model: authentik_core.application
                identifiers:
                  slug: paperless
                attrs:
                  name: Paperless
                  provider: !KeyOf paperless
                  meta_launch_url: https://paperless.luisbeu.de
                  policy_engine_mode: any
              - model: authentik_providers_oauth2.oauth2provider
                id: open-webui
                identifiers:
                  name: Open WebUI
                attrs:
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                  client_type: confidential
                  client_id: open-webui
                  client_secret: !Env OPENWEBUI_OIDC_SECRET
                  redirect_uris:
                    - matching_mode: strict
                      url: https://chat.luisbeu.de/oauth/oidc/callback
                      redirect_uri_type: authorization
                  property_mappings:
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
              - model: authentik_core.application
                identifiers:
                  slug: open-webui
                attrs:
                  name: Open WebUI
                  provider: !KeyOf open-webui
                  meta_launch_url: https://chat.luisbeu.de
                  policy_engine_mode: any
