# LAN only.
# WebDAV keeps its own Ingress and password.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: paperless
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/oauth2-proxy
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: paperless
      component: paperless
      port: 8000
    host: paperless.luisbeu.de
    upstream: paperless:8000
    clientId: paperless
    clientSecretName: paperless-gate
    clientSecretKey: client-secret
    cookieSecretName: paperless-gate
    cookieSecretKey: cookie-secret
    groups:
      - paperless
      - admins
